<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Engine X | Overlay</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --green: #2ea043; --red: #f85149; --grey: #8b949e; }
        body { font-family: 'Segoe UI', monospace; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        
        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        
        .ticker-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .ticker-card { 
            background: #21262d; border: 1px solid var(--border); border-radius: 4px; padding: 8px; 
            text-align: center; transition: background-color 0.3s;
        }
        .ticker-sym { font-weight: bold; color: white; font-size: 0.8rem; }
        .ticker-price { font-size: 1rem; font-family: 'Courier New', monospace; margin-top: 5px; }

        .flash-up { background-color: rgba(46, 160, 67, 0.3) !important; }
        .flash-down { background-color: rgba(248, 81, 73, 0.3) !important; }

        .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        .signals-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .signal-card { background: #0f1319; border: 1px solid var(--border); padding: 15px; border-radius: 6px; cursor: pointer; transition: border-color 0.2s; }
        .signal-card:hover { border-color: var(--accent); }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; float: right; }
        .badge.LONG { background: rgba(46, 160, 67, 0.2); color: var(--green); border: 1px solid var(--green); }
        .badge.SHORT { background: rgba(248, 81, 73, 0.2); color: var(--red); border: 1px solid var(--red); }
        
        .strength-val { font-size: 0.9rem; font-weight: bold; margin-top: 5px; }
        .pos-strength { color: var(--red); }
        .neg-strength { color: var(--green); }

        .setup-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 5px; }

        input, button, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--green); border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #3fb950; }
        
        #networkGraph { cursor: grab; }
        #networkGraph:active { cursor: grabbing; }

        .toggle-group { display: flex; gap: 15px; color: #8b949e; font-size: 0.85rem; }
        .toggle-group input { width: auto; margin-right: 5px; margin-top: 0; }
        .hidden-panel { display: none !important; }
    </style>
</head>
<body>

<div class="header">
    <h2>Crypto Quants List <span style="font-size:0.6em; color:var(--accent);">// ANALYTICS</span></h2>
    <div style="font-size: 0.8rem;">FEED: <span id="wsStatus" style="color:var(--red)">OFFLINE</span></div>
</div>

<div class="dashboard-grid">
    
    <div class="sidebar">
        <div class="panel">
            <div style="color:#8b949e; font-size:0.9rem;">Demo Equity</div>
            <div id="usdtBalance" style="font-size: 1.8rem; font-weight: bold; margin-top:5px;">--</div>
        </div>

        <div class="panel">
            <div style="margin-bottom:10px; font-weight:bold;">Active Orders</div>
            <div id="ordersList" style="font-size:0.85rem; color:#8b949e;">Scanning...</div>
        </div>

        <div class="panel">
            <label>Watchlist</label>
            <textarea id="coinInput" rows="10" style="width:100%; background:#0d1117; color:#c9d1d9; border:1px solid #30363d; padding:5px; font-family:monospace; font-size:0.8rem;">BTC-USD, ETH-USD, SOL-USD, BNB-USD, XRP-USD, ADA-USD, AVAX-USD, DOT-USD, TRX-USD, TON-USD, LINK-USD, MATIC-USD, NEAR-USD, ATOM-USD, LTC-USD, BCH-USD, APT-USD, SUI-USD, ALGO-USD, ICP-USD, HBAR-USD, FTM-USD, KAS-USD, SEI-USD, INJ-USD</textarea>
            <button onclick="startSystem()" style="margin-top:10px;">RUN ENGINE</button>
        </div>
    </div>

    <div class="main-content">
        
        <div class="panel">
            <div style="margin-bottom:10px; font-weight:bold; color:var(--accent);">LIVE PRICES</div>
            <div class="ticker-board" id="tickerBoard">
                <div style="color:#8b949e;">System Standby...</div>
            </div>
        </div>

        <div class="viz-grid">
            <div class="panel">
                <div style="margin-bottom:10px; font-weight:bold;">Physics Mesh (Click Nodes)</div>
                <canvas id="networkGraph" height="300" style="width:100%; border:1px dashed #30363d; background:#111;"></canvas>
            </div>
            
            <div class="panel">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <div style="font-weight:bold;">Price Chart (60D)</div>
                    <div class="toggle-group">
                        <div>
                            <input type="checkbox" id="btcOverlay" onchange="refreshChart()"> 
                            <label for="btcOverlay">Overlay BTC</label>
                        </div>
                        <div>
                            <input type="checkbox" id="bettiToggle" onchange="toggleBetti()" checked> 
                            <label for="bettiToggle">Show Topology</label>
                        </div>
                    </div>
                </div>
                
                <canvas id="priceChart" style="width:100%; max-height:250px;"></canvas>
                <div id="chartLabel" style="text-align:center; font-size:0.8rem; color:#8b949e; margin-top:10px;">Select a node/card to view</div>
            </div>
        </div>

        <!-- BETTI CHART ROW (Toggleable) -->
        <div class="panel" id="bettiPanel">
            <div style="margin-bottom:10px; font-weight:bold;">Topology: Betti-0 Curve</div>
            <canvas id="bettiChart" style="width:100%; max-height:200px;"></canvas>
        </div>

        <div class="panel">
            <div style="margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:5px;">
                TRADING SIGNALS (1:2 RR)
            </div>
            <div id="loading" style="display:none; text-align:center; color:var(--accent); padding:20px;">
                CALCULATING MESH FORCES...
            </div>
            <div class="signals-container" id="signalsArea"></div>
        </div>

    </div>
</div>

<script>
    let activeSocket = null;
    let priceBuffer = {}; 
    let oldPriceBuffer = {}; 
    let lastUpdateUI = 0; 
    let currentSelectedCoin = null; 
    
    // Physics
    let physicsNodes = [];
    let physicsEdges = [];
    let animationFrameId = null;
    let transform = { k: 0.8, x: 0, y: 0 }; 
    let draggedNode = null;
    let isPanning = false;
    let startPan = { x: 0, y: 0 };

    function startSystem() {
        initWebSocket();
        runAnalysis();
    }

    function initWebSocket() {
        if(activeSocket) activeSocket.close();
        const rawCoins = document.getElementById('coinInput').value.split(/,|\n/).map(c => c.trim()).filter(c => c);
        const symbols = rawCoins.map(c => c.split('-')[0] + 'USDT'); 
        const board = document.getElementById('tickerBoard');
        board.innerHTML = '';
        symbols.forEach(sym => {
            board.innerHTML += `<div class="ticker-card" id="card-${sym}"><div class="ticker-sym">${sym}</div><div class="ticker-price" id="price-${sym}">--</div></div>`;
        });
        activeSocket = new WebSocket('wss://stream.bybit.com/v5/public/linear');
        activeSocket.onopen = () => {
            document.getElementById('wsStatus').innerText = "LIVE";
            document.getElementById('wsStatus').style.color = "#2ea043";
            activeSocket.send(JSON.stringify({ "op": "subscribe", "args": symbols.map(s => `tickers.${s}`) }));
        };
        activeSocket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.topic && msg.topic.startsWith('tickers.')) {
                const sym = msg.topic.split('.')[1];
                if(msg.data && msg.data.lastPrice) {
                    const price = parseFloat(msg.data.lastPrice);
                    if(priceBuffer[sym]) oldPriceBuffer[sym] = priceBuffer[sym];
                    priceBuffer[sym] = price;
                }
            }
            if (Date.now() - lastUpdateUI > 1000) { updateAllTickers(); lastUpdateUI = Date.now(); }
        };
    }

    function updateAllTickers() {
        Object.keys(priceBuffer).forEach(sym => {
            const priceEl = document.getElementById(`price-${sym}`);
            const cardEl = document.getElementById(`card-${sym}`);
            if(priceEl && !isNaN(priceBuffer[sym])) {
                const current = priceBuffer[sym];
                const old = oldPriceBuffer[sym] || current;
                priceEl.innerText = current.toFixed(current < 10 ? 4 : 2);
                cardEl.classList.remove('flash-up', 'flash-down');
                if (current > old) cardEl.classList.add('flash-up');
                else if (current < old) cardEl.classList.add('flash-down');
                setTimeout(() => cardEl.classList.remove('flash-up', 'flash-down'), 500);
            }
        });
    }

    async function runAnalysis() {
        document.getElementById('loading').style.display = 'block';
        const coins = document.getElementById('coinInput').value.split(/,|\n/).map(c => c.trim()).filter(c => c);
        try {
            const res = await fetch('/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ coins: coins })
            });
            const data = await res.json();
            if(data.error) { alert(data.error); return; }

            renderSignals(data);
            drawBettiChart(data.topology);
            initPhysics(data.network_graph);
            
        } catch(e) { console.error(e); }
        finally { document.getElementById('loading').style.display = 'none'; }
    }

    function renderSignals(data) {
        const container = document.getElementById('signalsArea');
        container.innerHTML = '';
        Object.keys(data.market_data).forEach(ticker => {
            const info = data.market_data[ticker];
            const rr = info.rr_setup;
            const strengthPct = (info.residual_e * 100).toFixed(2);
            const strengthClass = info.residual_e > 0 ? 'pos-strength' : 'neg-strength';
            container.innerHTML += `
                <div class="signal-card" onclick="loadChart('${ticker}')">
                    <div style="font-weight:bold; margin-bottom:5px; display:flex; justify-content:space-between;">
                        <span>${ticker}</span> 
                        <span class="badge ${info.signal}">${info.signal}</span>
                    </div>
                    <div class="strength-val ${strengthClass}">Strength: ${strengthPct > 0 ? '+' : ''}${strengthPct}%</div>
                    ${info.signal !== 'NEUTRAL' ? `
                    <div style="margin-top:10px;">
                        <div class="setup-row"><span style="color:#8b949e">Entry</span> <span>$${rr.entry.toFixed(4)}</span></div>
                        <div class="setup-row"><span style="color:#8b949e">Stop</span> <span style="color:#d2a8ff">$${rr.sl.toFixed(4)}</span></div>
                        <div class="setup-row"><span style="color:#8b949e">Target</span> <span style="color:#58a6ff">$${rr.tp.toFixed(4)}</span></div>
                    </div>` : '<div style="text-align:center; color:#8b949e; font-size:0.8rem; margin-top:15px;">No Trade</div>'}
                </div>
            `;
        });
    }

    // --- CHARTING (DUAL AXIS) ---
    let priceChart = null;

    async function loadChart(ticker) {
        currentSelectedCoin = ticker;
        refreshChart();
    }

    async function refreshChart() {
        if(!currentSelectedCoin) return;
        const useOverlay = document.getElementById('btcOverlay').checked;
        document.getElementById('chartLabel').innerText = `Loading ${currentSelectedCoin}...`;

        try {
            const res = await fetch('/history', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ticker: currentSelectedCoin, overlay_btc: useOverlay })
            });
            const data = await res.json();
            
            if(data.error) { alert(data.error); return; }
            
            drawPriceChart(data);
            document.getElementById('chartLabel').innerText = `${data.ticker} Trend ${useOverlay ? '(with BTC Overlay)' : ''}`;

        } catch(e) { console.error(e); }
    }

    function drawPriceChart(data) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        if(priceChart) priceChart.destroy();
        
        const prices = data.prices;
        const color = prices[prices.length-1] > prices[0] ? '#2ea043' : '#f85149';
        
        const datasets = [{
            label: data.ticker,
            data: prices,
            borderColor: color,
            backgroundColor: color + '20',
            fill: true,
            yAxisID: 'y',
            pointRadius: 0
        }];

        if (data.btc_prices.length > 0) {
            datasets.push({
                label: 'Bitcoin',
                data: data.btc_prices,
                borderColor: '#8b949e', // Grey for overlay
                borderDash: [5, 5],     // Dashed line
                fill: false,
                yAxisID: 'y1',          // Right Axis
                pointRadius: 0
            });
        }
        
        priceChart = new Chart(ctx, {
            type: 'line',
            data: { labels: data.labels, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: { display: false },
                    y: { 
                        type: 'linear', display: true, position: 'left',
                        grid: { color: '#30363d' }, ticks: { color: color, font:{size:9} }
                    },
                    y1: {
                        type: 'linear', display: data.btc_prices.length > 0, position: 'right',
                        grid: { drawOnChartArea: false }, // Avoid grid overlap
                        ticks: { color: '#8b949e', font:{size:9} }
                    }
                },
                plugins: { legend: { display: true, labels: { color: '#c9d1d9' } } }
            }
        });
    }

    // --- TOGGLES ---
    function toggleBetti() {
        const show = document.getElementById('bettiToggle').checked;
        const panel = document.getElementById('bettiPanel');
        if(show) panel.classList.remove('hidden-panel');
        else panel.classList.add('hidden-panel');
    }

    // --- PHYSICS GRAPH ---
    function initPhysics(graphData) {
        if(animationFrameId) cancelAnimationFrame(animationFrameId);
        const canvas = document.getElementById('networkGraph');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        const width = canvas.width;
        const height = canvas.height;

        physicsNodes = graphData.nodes.map(n => {
            let color = "#8b949e"; 
            if (n.residual > 0.015) color = "#f85149";
            if (n.residual < -0.015) color = "#2ea043";

            return {
                id: n.id,
                x: width/2 + (Math.random() - 0.5) * 100,
                y: height/2 + (Math.random() - 0.5) * 100,
                vx: 0, vy: 0,
                color: color,
                radius: 8,
                mass: 1
            };
        });

        physicsEdges = graphData.edges.map(e => ({
            source: physicsNodes.find(n => n.id === e.source),
            target: physicsNodes.find(n => n.id === e.target),
            weight: e.weight
        })).filter(e => e.source && e.target);

        updatePhysics();
    }

    function updatePhysics() {
        const repulsion = 1000;
        const springLength = 80;
        const springK = 0.05;
        const damping = 0.85;

        physicsNodes.forEach(node => {
            if(node === draggedNode) return;
            let fx = 0, fy = 0;
            physicsNodes.forEach(other => {
                if(node === other) return;
                const dx = node.x - other.x;
                const dy = node.y - other.y;
                const distSq = dx*dx + dy*dy + 0.1;
                const force = repulsion / distSq;
                const dist = Math.sqrt(distSq);
                fx += (dx/dist) * force;
                fy += (dy/dist) * force;
            });
            physicsEdges.forEach(edge => {
                if(edge.source !== node && edge.target !== node) return;
                const other = edge.source === node ? edge.target : edge.source;
                const dx = node.x - other.x;
                const dy = node.y - other.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const force = (dist - springLength) * springK * edge.weight; 
                fx -= (dx/dist) * force;
                fy -= (dy/dist) * force;
            });
            const cx = document.getElementById('networkGraph').width / 2;
            const cy = document.getElementById('networkGraph').height / 2;
            fx += (cx - node.x) * 0.02;
            fy += (cy - node.y) * 0.02;

            node.vx = (node.vx + fx) * damping;
            node.vy = (node.vy + fy) * damping;
            node.x += node.vx;
            node.y += node.vy;
        });

        drawPhysicsGraph();
        animationFrameId = requestAnimationFrame(updatePhysics);
    }

    function drawPhysicsGraph() {
        const canvas = document.getElementById('networkGraph');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        const cx = width / 2;
        const cy = height / 2;
        ctx.translate(transform.x, transform.y);
        ctx.translate(cx, cy);
        ctx.scale(transform.k, transform.k);
        ctx.translate(-cx, -cy);

        physicsEdges.forEach(e => {
            ctx.beginPath();
            ctx.moveTo(e.source.x, e.source.y);
            ctx.lineTo(e.target.x, e.target.y);
            ctx.strokeStyle = `rgba(88, 166, 255, ${e.weight * 0.8})`;
            ctx.lineWidth = e.weight * 2;
            ctx.stroke();
        });

        physicsNodes.forEach(n => {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius, 0, 2 * Math.PI);
            ctx.fillStyle = n.color; 
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.font = "bold 12px monospace";
            ctx.textAlign = "center";
            ctx.fillText(n.id.split('-')[0], n.x, n.y - 12);
        });
        ctx.restore();
    }

    const canvas = document.getElementById('networkGraph');
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const rawX = e.clientX - rect.left;
        const rawY = e.clientY - rect.top;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const x = (rawX - transform.x - cx) / transform.k + cx;
        const y = (rawY - transform.y - cy) / transform.k + cy;
        return { x, y };
    }

    canvas.addEventListener('mousedown', (e) => {
        const m = getMousePos(e);
        let hitNode = null;
        for (let n of physicsNodes) {
            const dist = Math.sqrt((n.x - m.x)**2 + (n.y - m.y)**2);
            if (dist < n.radius + 5) { hitNode = n; break; }
        }
        if (hitNode) { 
            draggedNode = hitNode; 
            draggedNode.vx = 0; 
            draggedNode.vy = 0; 
            loadChart(hitNode.id); 
        }
        else { isPanning = true; startPan = { x: e.offsetX - transform.x, y: e.offsetY - transform.y }; }
    });

    canvas.addEventListener('mousemove', (e) => {
        const m = getMousePos(e);
        if (draggedNode) { draggedNode.x = m.x; draggedNode.y = m.y; }
        else if (isPanning) { transform.x = e.offsetX - startPan.x; transform.y = e.offsetY - startPan.y; }
    });

    canvas.addEventListener('mouseup', () => { draggedNode = null; isPanning = false; });
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        transform.k = Math.max(0.1, Math.min(transform.k + delta, 5));
    });

    let bettiChart = null;
    function drawBettiChart(topology) {
        const ctx = document.getElementById('bettiChart').getContext('2d');
        if(bettiChart) bettiChart.destroy();
        bettiChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: topology.epsilons.map(e => e.toFixed(2)),
                datasets: [{ label: 'β0', data: topology.betti_0, borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)', fill: true, tension: 0.3 }]
            },
            options: { responsive: true, scales: { x: {display:true, grid:{color:'#30363d'}}, y: {display:true, grid:{color:'#30363d'}} } }
        });
    }

    async function fetchAccount() {
        try {
            const res = await fetch('/account');
            const data = await res.json();
            if(data.balance) {
                document.getElementById('usdtBalance').innerText = parseFloat(data.balance.USDT || 0).toFixed(2);
                const list = document.getElementById('ordersList');
                list.innerHTML = data.orders.length ? data.orders.map(o => `<div style="border-bottom:1px solid #333">${o.side} ${o.symbol}</div>`).join('') : "No Orders";
            }
        } catch(e) {}
    }
    setInterval(fetchAccount, 5000);
    fetchAccount();
</script>
</body>
</html>
